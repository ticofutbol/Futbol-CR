name: Actualizar dashboard

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 6:00 a.m. hora de Costa Rica (UTC-6, sin horario de verano)
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write   # para hacer commit de los datos nuevos
  pages: write      # para publicar en GitHub Pages
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Descargar datos y generar la página
        run: npm run update
        env:
          TZ: America/Costa_Rica
          API_KEY: ${{ secrets.API_KEY }}   # solo se usa si se agrega API-Football; puede no existir

      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date +'%Y-%m-%d')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
